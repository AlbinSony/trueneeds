<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - True Needs</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">
        <i class="ri-building-3-line"></i>
        <span>True Needs</span>
      </a>
      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list">
          <li><a href="index.html#home" class="nav__link">Home</a></li>
          <li><a href="index.html#about" class="nav__link">About</a></li>

          <li><a href="gallery.html" class="nav__link active-link">Gallery</a></li>

        </ul>
      </div>
      <div class="nav__toggle" id="nav-toggle">
        <i class="ri-apps-2-line"></i>

        <h2 class="section__title">Gallery</h2>
        <p class="section__subtitle">Explore our completed projects and highlights</p>
        <div class="gallery__grid">

          <img src="assets/img/projects-img-1.png" alt="Project 1" class="gallery__img" />
          <img src="assets/img/projects-img-2.png" alt="Project 2" class="gallery__img" />
